server.port=8080
server.error.include-message=always

# --- MySQL ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clinic_noshow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA -----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Allowed frontend origin (Vite dev server by default)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.auth.jwt-secret=${JWT_SECRET:CareSlot-local-development-secret-change-before-deploy-2026}
